# 알림 함수(push-tick)를 Supabase 에 자동 배포합니다.
# 필요한 GitHub Secrets: SUPABASE_ACCESS_TOKEN, VAPID_PRIVATE_KEY, CRON_SECRET
name: Deploy push-tick
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-function.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}   # 선택: 있으면 장소 검색에 카카오 사용
      PROJECT_REF: gfaawesckaispbyjkost
      VAPID_PUBLIC_KEY: BLR6y1KOYQrf3bZcN0GaeBL2Fx-py2sEh139Ouxx2Yt9KllNTbAQ1xZ-XAizSQfTf__yiXwqSXRQvNN_G4qo--g
    steps:
      - name: Check secrets
        run: |
          missing=""
          for k in SUPABASE_ACCESS_TOKEN VAPID_PRIVATE_KEY CRON_SECRET; do
            [ -z "${!k}" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then echo "::error::GitHub Secrets 에 없음:$missing"; exit 1; fi
      - name: Clean secrets (복사할 때 섞인 공백·따옴표 제거)
        run: |
          vp=$(printf %s "$VAPID_PRIVATE_KEY" | tr -cd 'A-Za-z0-9_-')
          cs=$(printf %s "$CRON_SECRET" | tr -cd 'A-Za-z0-9_-')
          echo "::add-mask::$vp"; echo "::add-mask::$cs"
          echo "CLEAN_VAPID_PRIVATE_KEY=$vp" >> "$GITHUB_ENV"
          echo "CLEAN_CRON_SECRET=$cs" >> "$GITHUB_ENV"
          echo "VAPID_PRIVATE_KEY 길이: ${#vp} (정상 43) / 원래 ${#VAPID_PRIVATE_KEY}"
          echo "CRON_SECRET 길이: ${#cs} (정상 64) / 원래 ${#CRON_SECRET}"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Supabase CLI 는 npm 으로 받음 (setup-cli 의 'latest' 조회가 GitHub API 요청 한도에 자주 걸려서)
      - name: Install Supabase CLI (npm)
        run: |
          for t in 1 2 3; do npx --yes supabase@2 --version && break; echo "retry $t"; sleep 15; done
          echo "SB=npx --yes supabase@2" >> "$GITHUB_ENV"
      - name: Apply DB migrations (supabase/migrations/*.sql, 여러 번 실행해도 안전)
        run: |
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            body=$(jq -Rs '{query: .}' < "$f")
            res=$(curl -s -w '\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
            echo "$res" | head -c 600; echo
            code=$(echo "$res" | tail -1)
            case "$code" in 2*) ;; *) echo "::error::$f 적용 실패 (HTTP $code)"; exit 1;; esac
          done
      - name: Set function secrets
        run: |
          $SB secrets set --project-ref "$PROJECT_REF" --yes \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$CLEAN_VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="mailto:bellone1110@gmail.com" \
            CRON_SECRET="$CLEAN_CRON_SECRET"
          kk=$(printf %s "$KAKAO_REST_KEY" | tr -cd 'A-Za-z0-9')
          if [ -n "$kk" ]; then
            echo "::add-mask::$kk"
            echo "KAKAO_REST_KEY 길이: ${#kk} (보통 32) → 장소 검색: 카카오"
            $SB secrets set --project-ref "$PROJECT_REF" --yes KAKAO_REST_KEY="$kk"
          else
            echo "KAKAO_REST_KEY 없음 → 장소 검색: OpenStreetMap"
          fi
      - name: Deploy function
        run: $SB functions deploy push-tick --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Health check (cron 과 같은 방식으로 호출)
        run: |
          sleep 5
          res=$(curl -s -w '\n%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/push-tick" \
            -H "Content-Type: application/json" -H "x-cron-secret: $CLEAN_CRON_SECRET" -d '{"action":"tick"}')
          echo "$res"
          [ "$(echo "$res" | tail -1)" = "200" ] || { echo "::error::함수 응답이 200이 아님"; exit 1; }
      - name: DB check (구성원 · 매분 호출 기록)
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
                  -d "{\"query\": \"$1\"}"; echo; }
          q "select name, mood_profile from public.members"
          q "select (select count(*) from public.joy_settings) as joy_settings, (select count(*) from public.joy_activities) as joy_activities, (select count(*) from public.push_subs where app = 'woori') as woori_subs"
          q "select (select count(*) from public.moods where scores ?| array['focus','mood']) as daily4_moods, (select max((scores->>'procrast')::numeric) from public.moods) as max_procrast, (select count(*) from public.mood_private) as private_notes, (select count(*) from public.places where cardinality(tags) > 0) as tagged_places"
          q "select (select count(*) from public.pause_rules) as pause_rules, (select count(*) from public.pause_sessions) as pause_sessions, (select count(*) from public.push_subs where app = 'pause') as pause_subs"
          q "select jobname, schedule, active from cron.job"
          q "select status_code, left(content::text, 80) as body, created from net._http_response order by created desc limit 3"
          q "select m.name, coalesce(t.total, 0) as xp, (select count(*) from public.rewards r where r.member_id = m.id) as rewards from public.members m left join public.xp_totals t on t.member_id = m.id"
          q "select count(*) as items, count(*) filter (where kind = 'task') as quests from public.items"
          q "select count(*) as calm_sessions, count(*) filter (where ended_at is null) as active from public.calm_sessions"
          q "select count(*) as moods from public.moods"
          q "select count(*) as places from public.places"
      - name: Place search check (장소 검색 동작 확인)
        run: |
          for q in "남산서울타워" "성수 카페"; do
            curl -s -X POST "https://$PROJECT_REF.supabase.co/functions/v1/push-tick" \
              -H "Content-Type: application/json" -H "x-cron-secret: $CLEAN_CRON_SECRET" \
              -d "{\"action\":\"place-test\",\"query\":\"$q\"}" | head -c 500; echo
            sleep 2
          done
      - name: JOY webhook check (잘못된 토큰은 403)
        run: |
          code=$(curl -s -o /tmp/joy.txt -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/push-tick" \
            -H "Content-Type: application/json" -d '{"action":"joy-event","token":"not-a-token","event":"open"}')
          cat /tmp/joy.txt; echo " ($code)"
          [ "$code" = "403" ] || { echo "::error::JOY 웹훅 응답이 예상과 다름"; exit 1; }
